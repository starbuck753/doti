apply plugin: 'com.android.application'

def packageJson = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def versionCodeValue = (project.findProperty('DOTI_VERSION_CODE') ?: '1').toInteger()
def signingPropertiesFile = rootProject.file('keystore.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace = "com.doti.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.doti.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeValue
        versionName packageJson.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties.getProperty('storeFile', ''))
                storePassword signingProperties.getProperty('storePassword', '')
                keyAlias signingProperties.getProperty('keyAlias', '')
                keyPassword signingProperties.getProperty('keyPassword', '')
                storeType signingProperties.getProperty('storeType', 'PKCS12')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    def required = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
    def missing = required.findAll { !signingProperties.getProperty(it)?.trim() }
    def keyPath = signingProperties.getProperty('storeFile')
    def missingStore = !keyPath || !rootProject.file(keyPath).isFile()
    if (!signingPropertiesFile.exists() || !missing.isEmpty() || missingStore) {
        def problems = missing.findAll { it != 'storeFile' }
        if (missingStore) problems << 'storeFile (missing or not found)'
        throw new GradleException("Release signing is not configured. Create android/keystore.properties from android/keystore.properties.example and configure a valid, private keystore. Missing or invalid: ${problems.join(', ')}")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
